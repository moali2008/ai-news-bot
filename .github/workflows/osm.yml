name: fetch-osm
on: { push: { branches: [osm-data] } }
permissions: { contents: write }
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[data]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            curl -sS --fail -m 200 --data-urlencode data@tools/q.txt "$u" -o raw.json && break; sleep 5; done
          ls -la raw.json && cd . && python3 tools/pack.py && gzip -9 -k la.json && ls -la la.json*
          git config user.name osm-bot && git config user.email osm-bot@users.noreply.github.com
          git add la.json && git commit -m "[data] downtown LA from OpenStreetMap" && git push

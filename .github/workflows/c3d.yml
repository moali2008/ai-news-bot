name: char-3d
on: { push: { branches: [char-3d] } }
permissions: { contents: write }
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[out]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: |
          set +e
          bash tools/tsr.sh > log_tsr.txt 2>&1
          sudo apt-get update -qq && sudo apt-get install -y -qq blender > /dev/null 2>&1
          blender --version | head -1 >> log_rig.txt
          blender -b -P tools/rig.py >> log_rig.txt 2>&1
          mkdir -p res && cp -r out res/ 2>/dev/null; cp char.glb res/ 2>/dev/null; cp log_*.txt res/
          git config user.name c3d-bot && git config user.email c3d-bot@users.noreply.github.com
          git add res && git commit -m "[out] character build" && git push
